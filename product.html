<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="pro.css">
</head>
<body>
<div class="container">
<div class="product">
    <div class="gallery">
<img src="https://m.media-amazon.com/images/I/61sAImooPoL._AC_SX522_.jpg" id="prodimg">
<div class="controls">
    <span class="btnactive"></span>
    <span class="btn"></span>
    <span class="btn"></span>
</div>
    </div>
    <div class="details">
            <h1>casual t shirt</h1>
            <h2> $15.00</h2>
            <h3>30% off</h3>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Harum veniam fuga laboriosam consectetur!</p>
            <form>
                <div class="size-select">
                    <p>size</p>
                    <label for="small">
                        <input type="radio" name="size" id="small">
                        <span>s</span>
                    </label>
                    <label for="medium">
                        <input type="radio" name="size" id="medium">
                        <span>m</span>
                    </label>
                    <label for="large">
                        <input type="radio" name="size" id="large">
                        <span>l</span>
                    </label>
                    <label for="x-large">
                        <input type="radio" name="size" id="x-large">
                        <span>xll</span>
                    </label>
                    <label for="xx-large">
                        <input type="radio" name="size" id="xx-large">
                        <span>xxl</span>
                    </label>
                </div>



                <div class="color-select">
                    <p>color</p>
                    <label for="red">
                        <input type="radio" name="color" id="red">
                        <span class="color-1"></span>
                    </label>
                    <label for="green">
                        <input type="radio" name="color" id="green">
                        <span class="color-2"></span>
                    </label>
                    <label for="blue">
                        <input type="radio" name="color" id="blue">
                        <span class="color-3"></span>
                    </label>
                    <label for="pink">
                        <input type="radio" name="color" id="pink">
                        <span class="color-4"></span>
                    </label>
            
                </div>

                <div class="quantity-select">
                    <p>quantity</p>
                    <input type="number" value="1">
                </div>
                <button>buy now</button>
            </form>

    </div>
</div>
</div>












    <script src="prod.js"></script>
</body>
</html>
